<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chatzy</title>
<style>
:root{--p:#6c5ce7;--bg:#f5f4fb;--ink:#26243d;--muted:#77758b;--line:#e7e5ef;--red:#e7526a}*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f5f0ff,#edfbf7)}button,input{font:inherit}.hidden{display:none!important}.welcome{min-height:100vh;display:grid;place-items:center;padding:20px}.setup{width:min(430px,100%);background:#fff;border-radius:28px;padding:32px;text-align:center;box-shadow:0 20px 60px #443b7c24}.logo{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:24px;background:linear-gradient(135deg,var(--p),#a67af5);color:#fff;font-size:38px;font-weight:900;transform:rotate(-5deg)}h1{font-size:44px;margin:10px 0 0}.tag,.small{color:var(--muted)}label{display:block;text-align:left;font-weight:800;margin:15px 0 6px}input{border:2px solid var(--line);border-radius:13px;padding:12px;outline:none}.setup input{width:100%}input:focus{border-color:var(--p)}.avatars{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.pick,.avatar{display:grid;place-items:center;color:#fff;font-weight:900}.pick{width:52px;height:52px;border:3px solid transparent;border-radius:17px;font-size:22px;cursor:pointer}.pick.on{border-color:var(--ink);transform:translateY(-3px)}.primary,.soft,.danger{border:0;border-radius:13px;padding:11px 15px;font-weight:800;cursor:pointer}.primary{background:var(--p);color:#fff}.soft{background:#efecff;color:var(--p)}.danger{background:#fff0f3;color:var(--red)}.wide{width:100%;margin-top:10px}.error{color:var(--red);min-height:18px}.app{height:100vh;display:grid;grid-template-columns:300px 1fr;background:var(--bg)}aside{background:#fff;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;min-height:0}.brand{font-size:23px;font-weight:900;display:flex;gap:9px;align-items:center;margin-bottom:12px}.mini{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:var(--p);color:#fff}.me,.contact{display:flex;align-items:center;gap:10px}.me{background:#f5f2ff;padding:10px;border-radius:15px;margin-bottom:8px}.avatar{width:43px;height:43px;border-radius:14px;flex:0 0 auto}.details{min-width:0;flex:1}.details strong,.details small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.details small{color:var(--muted)}.section{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--muted);margin:18px 5px 7px}.list{overflow:auto;flex:1}.contact{width:100%;border:0;background:transparent;border-radius:15px;padding:9px;text-align:left;cursor:pointer}.contact:hover,.contact.active{background:#f0edff}.dot{width:9px;height:9px;border-radius:50%;background:#2dbf91}.panel{display:flex;flex-direction:column;min-width:0}.top{height:74px;background:#fff;border-bottom:1px solid var(--line);padding:13px 20px;display:flex;align-items:center;gap:10px}.actions{margin-left:auto;display:flex;gap:7px}.empty{margin:auto;text-align:center;color:var(--muted)}.hello{width:90px;height:64px;margin:auto;display:grid;place-items:center;border-radius:30px 30px 30px 7px;background:var(--p);color:#fff;font-size:23px;font-weight:900;transform:rotate(-5deg)}.chat{flex:1;display:flex;flex-direction:column;min-height:0}.messages{flex:1;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:9px}.msg{max-width:min(72%,520px);align-self:flex-start;background:#fff;border-radius:18px 18px 18px 5px;padding:10px 13px;box-shadow:0 4px 15px #2b285012}.msg.mine{align-self:flex-end;background:var(--p);color:#fff;border-radius:18px 18px 5px 18px}.msg small{display:block;font-size:10px;opacity:.65;margin-bottom:3px}.msg img{max-width:100%;border-radius:10px}.composer{display:flex;gap:8px;padding:14px 18px;background:#fff;border-top:1px solid var(--line)}.composer input{flex:1}.modalWrap{position:fixed;inset:0;background:#211d3e77;display:grid;place-items:center;padding:20px}.modal{position:relative;width:min(480px,100%);background:#fff;border-radius:24px;padding:27px}.close{position:absolute;right:14px;top:7px;border:0;background:none;font-size:30px;color:var(--muted)}.modal input{width:100%}.safe{padding:12px;border-radius:13px;background:#f7f7fb;margin:8px 0}.safe strong{display:block}.drawbox{padding:10px 18px;background:#fff;border-top:1px solid var(--line)}canvas{display:block;width:100%;max-width:650px;height:170px;border:2px dashed #c9c5dc;border-radius:13px;touch-action:none}.drawActions{display:flex;gap:7px;margin-top:8px}
@media(max-width:680px){.app{grid-template-columns:96px 1fr}aside{padding:8px}.brand span,.me .details,.contact .details,.desktop,.section{display:none}.brand,.me,.contact{justify-content:center}.me{background:transparent}.contact .avatar{width:48px;height:48px}.msg{max-width:88%}.top{padding:9px}.actions button{font-size:11px}}
</style>
</head>
<body>
<section id="welcome" class="welcome"><div class="setup"><div class="logo">C</div><h1>Chatzy</h1><p class="tag">Safe chats. Big imagination.</p><label>Choose a username</label><input id="name" maxlength="16" placeholder="SkyBuilder"><p class="small">Use a nickname, not your real full name.</p><label>Choose an avatar</label><div id="picks" class="avatars"></div><button id="start" class="primary wide">Enter Chatzy</button><p id="error" class="error"></p></div></section>
<main id="app" class="app hidden"><aside><div class="brand"><i class="mini">C</i><span>Chatzy</span></div><div id="me" class="me"></div><button id="add" class="primary wide"><span class="desktop">+ Add a friend</span><span class="mobile">+</span></button><button id="group" class="soft wide"><span class="desktop">+ Make a group</span><span class="mobile">G</span></button><div class="section">Chats</div><nav id="list" class="list"></nav><button id="safety" class="danger wide">Safety</button></aside><section class="panel"><header id="top" class="top"></header><div id="empty" class="empty"><div class="hello">Hi!</div><h2>Choose a chat</h2><p>Pick a friend to start chatting.</p></div><div id="chat" class="chat hidden"><div id="messages" class="messages"></div><div id="drawbox" class="drawbox hidden"><canvas id="canvas" width="600" height="170"></canvas><div class="drawActions"><input id="color" type="color" value="#6c5ce7"><button id="clear" class="soft">Clear</button><button id="sendDraw" class="primary">Send drawing</button></div></div><form id="form" class="composer"><button id="draw" type="button" class="soft">Draw</button><input id="message" maxlength="300" placeholder="Write a kind message..."><button class="primary">Send</button></form></div></section></main>
<div id="modalWrap" class="modalWrap hidden"><div class="modal"><button id="close" class="close">×</button><div id="modal"></div></div></div>
<script>
var choices=[["A","#6c5ce7"],["S","#00a8a8"],["Z","#ff7b54"],["M","#e6538f"],["K","#2f80ed"],["R","#35a85a"]];
var state={profile:null,active:null,blocked:[],chats:[{id:"nova",name:"Nova",letter:"N",color:"#e6538f",online:true,msgs:[{from:"Nova",text:"Hi! Want to draw something?",time:"4:30 PM"}]},{id:"max",name:"Max",letter:"M",color:"#2f80ed",online:true,msgs:[{from:"Max",text:"I made a new game level!",time:"4:12 PM"}]},{id:"stars",name:"Star Club",letter:"SC",color:"#ff8a3d",group:true,msgs:[{from:"Mia",text:"Welcome to the group!",time:"Yesterday"}]}]};
function q(s){return document.querySelector(s)}function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}function av(n,l,c){return '<div class="avatar" style="background:'+c+'">'+esc(l)+'</div>'}function save(){localStorage.setItem("chatzy-demo",JSON.stringify(state))}function load(){try{var x=JSON.parse(localStorage.getItem("chatzy-demo"));if(x&&x.profile)state=x}catch(e){}}
choices.forEach(function(a,i){var b=document.createElement("button");b.className="pick"+(i?"":" on");b.textContent=a[0];b.style.background=a[1];b.dataset.l=a[0];b.dataset.c=a[1];b.onclick=function(){document.querySelectorAll(".pick").forEach(function(x){x.classList.remove("on")});b.classList.add("on")};q("#picks").appendChild(b)});
q("#start").onclick=function(){var n=q("#name").value.trim();if(n.length<3){q("#error").textContent="Choose a username with at least 3 letters.";return}var a=q(".pick.on");state.profile={name:n,letter:a.dataset.l,color:a.dataset.c,code:n.slice(0,4).toUpperCase()+"-"+Math.floor(100+Math.random()*900)};save();show()};
function show(){q("#welcome").classList.add("hidden");q("#app").classList.remove("hidden");q("#me").innerHTML=av(state.profile.name,state.profile.letter,state.profile.color)+'<div class="details"><strong>'+esc(state.profile.name)+'</strong><small>Code: '+esc(state.profile.code)+'</small></div>';renderList();if(state.active)openChat(state.active)}
function renderList(){var list=q("#list");list.innerHTML="";state.chats.filter(function(c){return state.blocked.indexOf(c.id)<0}).forEach(function(c){var b=document.createElement("button"),last=c.msgs.length?c.msgs[c.msgs.length-1].text||"Drawing":"Start chatting";b.className="contact"+(state.active===c.id?" active":"");b.innerHTML=av(c.name,c.letter,c.color)+'<div class="details"><strong>'+esc(c.name)+'</strong><small>'+esc(last)+'</small></div>'+(c.online?'<i class="dot"></i>':'');b.onclick=function(){openChat(c.id)};list.appendChild(b)})}
function openChat(id){var c=state.chats.find(function(x){return x.id===id});if(!c)return;state.active=id;save();renderList();q("#empty").classList.add("hidden");q("#chat").classList.remove("hidden");q("#top").innerHTML=av(c.name,c.letter,c.color)+'<div class="details"><strong>'+esc(c.name)+'</strong><small>'+(c.group?"Group chat":c.online?"Online":"Offline")+'</small></div><div class="actions"><button id="report" class="soft">Report</button><button id="block" class="danger">Block</button></div>';q("#report").onclick=function(){report(c)};q("#block").onclick=function(){block(c)};renderMessages(c)}
function renderMessages(c){var box=q("#messages");box.innerHTML="";c.msgs.forEach(function(m){var d=document.createElement("div");d.className="msg "+(m.from===state.profile.name?"mine":"");d.innerHTML="<small>"+esc(m.from)+" · "+esc(m.time||"Now")+"</small>"+(m.image?'<img src="'+m.image+'" alt="Drawing">':"<span>"+esc(m.text)+"</span>");box.appendChild(d)});box.scrollTop=box.scrollHeight}
q("#form").onsubmit=function(e){e.preventDefault();var i=q("#message"),t=i.value.trim();if(!t)return;var c=state.chats.find(function(x){return x.id===state.active});c.msgs.push({from:state.profile.name,text:t,time:"Now"});i.value="";save();renderMessages(c);renderList();if(!c.group)setTimeout(function(){c.msgs.push({from:c.name,text:["Cool idea!","That sounds fun!","Nice!","Let us draw!"][Math.floor(Math.random()*4)],time:"Now"});save();renderMessages(c);renderList()},450)};
function modal(h){q("#modal").innerHTML=h;q("#modalWrap").classList.remove("hidden")}function close(){q("#modalWrap").classList.add("hidden")}q("#close").onclick=close;q("#modalWrap").onclick=function(e){if(e.target===q("#modalWrap"))close()};
q("#add").onclick=function(){modal('<h2>Add a friend</h2><p>Ask your friend for their private Chatzy code.</p><label>Friend code</label><input id="friendCode" placeholder="LUNA-88"><button id="find" class="primary wide">Add friend</button><p class="small">Try LUNA-88 in this demo. Never post your code publicly.</p><p id="result"></p>');q("#find").onclick=function(){if(q("#friendCode").value.trim().toUpperCase()!=="LUNA-88"){q("#result").textContent="That demo code was not found.";return}if(!state.chats.some(function(c){return c.id==="luna"}))state.chats.push({id:"luna",name:"Luna",letter:"L",color:"#20b486",online:true,msgs:[{from:"Luna",text:"Thanks for adding me!",time:"Now"}]});save();renderList();close();openChat("luna")}};
q("#group").onclick=function(){modal('<h2>Make a group</h2><label>Group name</label><input id="groupName" maxlength="24" placeholder="Art Club"><button id="make" class="primary wide">Create group</button>');q("#make").onclick=function(){var n=q("#groupName").value.trim();if(!n)return;var id="g"+Date.now();state.chats.push({id:id,name:n,letter:n.slice(0,2).toUpperCase(),color:"#ff8a3d",group:true,msgs:[{from:"Chatzy",text:"Your group is ready!",time:"Now"}]});save();close();openChat(id)}};
function report(c){modal('<h2>Tell an adult</h2><p>If a message feels mean, scary, or unsafe, stop replying.</p><div class="safe"><strong>1. Save the message</strong>Do not delete it yet.</div><div class="safe"><strong>2. Block the person</strong>They cannot message you in this demo.</div><div class="safe"><strong>3. Tell someone you trust</strong>A trusted adult can help.</div><button id="done" class="primary wide">Mark as reported</button>');q("#done").onclick=close}
function block(c){if(!confirm("Block "+c.name+"?"))return;state.blocked.push(c.id);state.active=null;save();renderList();q("#chat").classList.add("hidden");q("#empty").classList.remove("hidden");q("#top").innerHTML=""}
q("#safety").onclick=function(){modal('<h2>Safety Center</h2><div class="safe"><strong>Keep private things private</strong>Never share your address, school, password, or location.</div><div class="safe"><strong>Only add people you know</strong>Share friend codes privately.</div><div class="safe"><strong>Be kind</strong>Pause before you send.</div><div class="safe"><strong>Get help</strong>Block, report, and tell a trusted adult if something feels wrong.</div>')};
var canvas=q("#canvas"),ctx=canvas.getContext("2d"),drawing=false;ctx.lineWidth=5;ctx.lineCap="round";function pos(e){var r=canvas.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*canvas.width/r.width,y:(t.clientY-r.top)*canvas.height/r.height}}function begin(e){drawing=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}function move(e){if(!drawing)return;var p=pos(e);ctx.strokeStyle=q("#color").value;ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}function end(){drawing=false}["mousedown","touchstart"].forEach(function(x){canvas.addEventListener(x,begin)});["mousemove","touchmove"].forEach(function(x){canvas.addEventListener(x,move)});["mouseup","mouseleave","touchend"].forEach(function(x){canvas.addEventListener(x,end)});
q("#draw").onclick=function(){q("#drawbox").classList.toggle("hidden");ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height)};q("#clear").onclick=function(){ctx.clearRect(0,0,canvas.width,canvas.height)};q("#sendDraw").onclick=function(){var c=state.chats.find(function(x){return x.id===state.active});c.msgs.push({from:state.profile.name,image:canvas.toDataURL(),time:"Now"});save();renderMessages(c);q("#drawbox").classList.add("hidden")};
load();if(state.profile)show();
</script>
</body></html>
