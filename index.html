<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Chatzy — Messaging for Kids</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="wordmark"><span class="mark">C</span><strong>Chatzy</strong></div>
      <h1>Talk with your people.</h1>
      <p>Private messages, creative chats, and friends you know.</p>
      <form id="signupForm">
        <label for="username">Choose a username</label>
        <input id="username" maxlength="16" autocomplete="off" placeholder="SkyBuilder" required>
        <p class="field-note">Use a nickname, not your full real name.</p>
        <label>Choose an avatar</label>
        <div id="avatarPicker" class="avatar-picker"></div>
        <button class="primary full" type="submit">Create my account</button>
        <p id="authError" class="error" aria-live="polite"></p>
      </form>
      <p class="demo-note">Preview build: accounts and messages are saved on this device.</p>
    </div>
  </section>

  <main id="appView" class="app-view hidden">
    <aside id="rail" class="rail">
      <header class="rail-head">
        <div class="wordmark small"><span class="mark">C</span><strong>Chatzy</strong></div>
        <button id="profileButton" class="avatar-button" aria-label="Open profile"></button>
      </header>
      <label class="search"><span>Search</span><input id="searchInput" placeholder="Search chats"></label>
      <nav class="tabs" aria-label="Inbox sections">
        <button class="tab active" data-tab="messages">Messages</button>
        <button class="tab" data-tab="friends">Friends</button>
      </nav>
      <section id="messagesTab" class="tab-panel">
        <button id="newMessageButton" class="primary full">New message</button>
        <div id="conversationList" class="conversation-list"></div>
      </section>
      <section id="friendsTab" class="tab-panel hidden">
        <button id="addFriendButton" class="primary full">Add with friend code</button>
        <button id="newGroupButton" class="secondary full">Create a group</button>
        <div id="friendList" class="conversation-list"></div>
      </section>
      <button id="safetyButton" class="safety-link">Safety Center</button>
    </aside>

    <section class="conversation">
      <div id="emptyConversation" class="empty-conversation">
        <div class="empty-icon">C</div>
        <h2>Your messages</h2>
        <p>Choose a conversation or start a new one.</p>
      </div>
      <div id="activeConversation" class="active-conversation hidden">
        <header id="conversationHeader" class="conversation-head"></header>
        <div id="messageList" class="message-list" aria-live="polite"></div>
        <div id="drawingPanel" class="drawing-panel hidden">
          <canvas id="drawingCanvas" width="700" height="220"></canvas>
          <div class="drawing-tools">
            <input id="drawingColor" type="color" value="#5f56d9" aria-label="Drawing color">
            <button id="clearDrawing" class="secondary">Clear</button>
            <button id="sendDrawing" class="primary">Send drawing</button>
          </div>
        </div>
        <form id="composer" class="composer">
          <button id="drawingButton" class="composer-tool" type="button">Draw</button>
          <input id="messageInput" maxlength="500" autocomplete="off" placeholder="Message">
          <button class="send-button" aria-label="Send message">Send</button>
        </form>
      </div>
    </section>
  </main>

  <div id="modalBackdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <section class="modal">
      <button id="closeModal" class="modal-close" aria-label="Close">×</button>
      <div id="modalContent"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
